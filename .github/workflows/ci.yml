name: Bounded CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_FROZEN: "1"
  UV_NO_PROGRESS: "1"

jobs:
  bounded-verification:
    name: Tests and bounded contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CC: gcc
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install the locked uv version
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.2"
          enable-cache: "false"

      - name: Synchronize and identify the locked environment
        run: |
          set -euo pipefail
          uv sync --frozen
          test "$(uv --version)" = "uv 0.10.2"
          uv run --frozen python -VV
          uv run --frozen python -c 'import llvmlite, numba, numpy; assert (numpy.__version__, numba.__version__, llvmlite.__version__) == ("1.26.4", "0.59.1", "0.42.0")'

      - name: Check strict C11 compilation with GCC
        run: |
          set -euo pipefail
          common_flags=(-std=c11 -Wall -Wextra -Werror)
          for source in upper_exact.c upper_graph_builder.c upper_state_builder.c; do
            gcc "${common_flags[@]}" -fsyntax-only "$source"
          done
          gcc "${common_flags[@]}" -O2 -fPIC -shared upper_exact.c -o "$RUNNER_TEMP/upper_exact.so"
          gcc "${common_flags[@]}" -O2 upper_graph_builder.c -o "$RUNNER_TEMP/upper_graph_builder"
          gcc "${common_flags[@]}" -O2 upper_state_builder.c -o "$RUNNER_TEMP/upper_state_builder"

      - name: Check POSIX shell syntax
        run: sh -n scripts/fetch_source_paper.sh scripts/fetch_witness.sh

      - name: Run all 33 bounded tests
        run: |
          uv run --frozen python -m unittest -v \
            test_upper_engine.py test_upper_oracle.py \
            test_upper_contract.py test_reproduction.py

      - name: Verify every graph and oracle transition through h=6
        run: |
          uv run --frozen python verify_graph_oracle.py exhaustive \
            --max-history 6 \
            --workdir "$RUNNER_TEMP/oracle-h6"

      - name: Reproduce Lueker Table II through h=4
        run: |
          uv run --frozen python verify_lueker_table.py \
            --max-history 4 \
            --max-iterations 400 \
            --tolerance-units 256 \
            --witness-scale 67108864 \
            --threads 2 \
            --workdir "$RUNNER_TEMP/lueker-table-h4/work" \
            --output "$RUNNER_TEMP/lueker-table-h4/result.json"

  manuscript:
    name: Reproducible manuscript
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install the locked uv version
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.2"
          enable-cache: "false"

      - name: Synchronize the locked manuscript environment
        run: uv sync --frozen --group paper

      - name: Install hash-verified Tectonic 0.15.0
        env:
          TECTONIC_SHA256: dfb82876f2986862996e564fa507a9e576e0c1e3bee63c2c1bd677c2543e6407
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/tectonic-0.15.0.tar.gz"
          bin_dir="$RUNNER_TEMP/tectonic-bin"
          mkdir -p "$bin_dir"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            --output "$archive" \
            'https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.15.0/tectonic-0.15.0-x86_64-unknown-linux-musl.tar.gz'
          echo "$TECTONIC_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$bin_dir"
          echo "$bin_dir" >> "$GITHUB_PATH"
          "$bin_dir/tectonic" --version | grep -F 'tectonic 0.15.0'

      - name: Install independent PDF inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends poppler-utils

      - name: Build twice and compare every PDF
        run: |
          set -euo pipefail
          pdfs=(paper/cs_upper_bound.pdf paper/fig_history.pdf paper/fig_scaling.pdf)
          uv run --frozen --group paper make -C paper
          sha256sum "${pdfs[@]}" > "$RUNNER_TEMP/first-build.sha256"
          uv run --frozen --group paper make -C paper
          sha256sum "${pdfs[@]}" > "$RUNNER_TEMP/second-build.sha256"
          diff -u "$RUNNER_TEMP/first-build.sha256" "$RUNNER_TEMP/second-build.sha256"
          git diff --exit-code -- "${pdfs[@]}"

      - name: Check PDF integrity and extracted text
        run: |
          set -euo pipefail
          for pdf in paper/cs_upper_bound.pdf paper/fig_history.pdf paper/fig_scaling.pdf; do
            test -s "$pdf"
            pdfinfo "$pdf" > "$RUNNER_TEMP/$(basename "$pdf").info"
            grep -Eq '^Pages:[[:space:]]+[1-9][0-9]*$' "$RUNNER_TEMP/$(basename "$pdf").info"
          done
          pdftotext paper/cs_upper_bound.pdf "$RUNNER_TEMP/manuscript.txt"
          grep -Fq 'An Improved Upper Bound for the Binary' "$RUNNER_TEMP/manuscript.txt"
          grep -Fq '0.824443' "$RUNNER_TEMP/manuscript.txt"
